name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the profile API credential
        shell: bash
        run: |
          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "::error::Configure the ACCESS_TOKEN Actions secret before deploying live rankings."
            exit 1
          fi

      - name: Test and build
        run: npm test

      - name: Fetch verified rankings and generate HTML
        run: npm run refresh

      - name: Verify ranking output
        run: npm run verify:rankings

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
