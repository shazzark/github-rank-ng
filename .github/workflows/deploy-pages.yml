name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore last successful ranking snapshot
        uses: actions/cache/restore@v4
        with:
          path: .baseline
          key: ranking-baseline-${{ github.run_id }}
          restore-keys: ranking-baseline-

      - name: Require the profile API credential
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "::error::Configure the ACCESS_TOKEN Actions secret before deploying live rankings."
            exit 1
          fi

      - name: Test and build
        run: npm test

      - name: Fetch verified rankings and generate HTML
        run: npm run refresh
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Verify ranking output
        run: npm run verify:rankings

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/

      - name: Wait for the Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          artifacts_url="https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$artifacts_url" \
              | jq -e 'any(.artifacts[]?; .name == "github-pages" and .expired == false and .size_in_bytes > 0)' >/dev/null; then
              echo "The non-empty GitHub Pages artifact is available."
              exit 0
            fi
            echo "Waiting for the uploaded GitHub Pages artifact (attempt ${attempt}/12)."
            sleep 5
          done
          echo "::error::The uploaded GitHub Pages artifact was not visible in the Actions API after 60 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save successful ranking snapshot
        id: save-baseline
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .baseline
          key: ranking-baseline-${{ github.run_id }}

      - name: Report snapshot baseline cache failure
        if: steps.save-baseline.outcome == 'failure'
        run: echo "::warning::Pages deployed successfully, but the comparison snapshot cache was not saved. Future change counts may use an older baseline."

      - name: Report refresh failure
        if: failure() && steps.deployment.outcome != 'success'
        shell: bash
        run: |
          echo "## Ranking refresh failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The refresh failed before successful deployment. The previously deployed Pages snapshot remains available. Review the failed step logs before rerunning." >> "$GITHUB_STEP_SUMMARY"
